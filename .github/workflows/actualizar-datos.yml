name: Actualizar lugares

on:
  workflow_dispatch:
  schedule:
    # Día 5 de cada mes a las 6:00 a. m. de Colombia (11:00 UTC).
    - cron: '0 11 5 * *'

permissions:
  contents: write

concurrency:
  group: actualizar-lugares
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Descargar Overture, OpenStreetMap y registro mercantil
        run: |
          python -m pip install duckdb==1.5.6
          python scripts/descargar_fuentes.py fuentes
      - name: Unir las fuentes
        run: python scripts/unir_fuentes.py fuentes datos/lugares.json docs/lugares.csv
      - name: Revisar que la lista sea razonable
        # Si una fuente falla a medias, es mejor no publicar que dejar la app con una lista recortada.
        run: |
          python - <<'PY'
          import json
          d = json.load(open('datos/lugares.json', encoding='utf-8'))
          n = len(d['lugares'])
          print(f"{n} lugares, versión {d['version']}")
          assert n >= 450, f'Solo {n} lugares: no se publica'
          con_registro = sum(1 for l in d['lugares'] if l.get('registro'))
          assert con_registro >= 100, f'Solo {con_registro} cruces con el registro mercantil: no se publica'
          PY
      - name: Publicar la lista
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos/lugares.json docs/lugares.csv
          if git diff --cached --quiet; then
            echo "La lista no cambió."
            exit 0
          fi
          git commit -m "Actualizar lugares ($(date -u +%Y-%m-%d))"
          git push
