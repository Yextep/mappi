<div id="mapa" aria-label="Mapa de negocios y locales"></div>

<header class="barra">
  <form class="busqueda" id="form-busqueda" role="search">
    <svg class="icono icono-lupa"><use href="#i-lupa"/></svg>
    <input id="q" type="search" placeholder="Busca un negocio, producto o plato" autocomplete="off" enterkeyhint="search" aria-label="Buscar un negocio, producto o plato">
    <button type="button" id="limpiar" class="boton-icono" aria-label="Borrar búsqueda" hidden><svg class="icono"><use href="#i-x"/></svg></button>
    <button type="button" id="abrir-menu" class="boton-icono" aria-label="Datos, respaldo y lugares ocultos"><svg class="icono"><use href="#i-menu"/></svg></button>
  </form>
  <div class="chips" id="chips" aria-label="Categorías"></div>
  <div class="chips" id="chips-platos" aria-label="Platos" hidden></div>
</header>

<div class="flotantes">
  <button type="button" id="agregar" class="flotante" aria-label="Agregar un lugar que no está en el mapa"><svg class="icono"><use href="#i-mas"/></svg></button>
  <button type="button" id="ubicarme" class="flotante" aria-label="Ir a mi ubicación"><svg class="icono"><use href="#i-ubicar"/></svg></button>
</div>

<div id="mira" class="mira" hidden aria-hidden="true"><svg class="icono"><use href="#i-pin"/></svg></div>

<section class="hoja" id="hoja" data-vista="resumen" aria-live="polite">
  <button type="button" class="hoja-asa" id="asa" aria-label="Mostrar u ocultar la lista"><span></span></button>
  <div id="hoja-contenido"></div>
</section>

<div id="aviso" class="aviso" role="status" hidden></div>

<input type="file" id="archivo-respaldo" accept="application/json,.json" hidden>

<script src="vendor/maplibre-gl.js"></script>
<script src="app.js"></script>
</body>
</html>
